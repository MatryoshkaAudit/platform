[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["protos"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade (modern Python 3.10+ syntax)
    "B",     # flake8-bugbear (anti-patterns)
    "S",     # flake8-bandit (security & secrets)
    "T20",   # flake8-print (no print in production)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async (asyncio event loop safety)
    "BLE",   # flake8-blind-except
    "RUF",   # Ruff-specific senior rules
]
ignore = [
    "E501",    # Line length handled by formatter
    "RUF001",  # Ambiguous Cyrillic homoglyphs in Russian strings
    "RUF002",  # Ambiguous Cyrillic homoglyphs in Russian docstrings
    "RUF003",  # Ambiguous Cyrillic homoglyphs in Russian comments
]

[tool.ruff.lint.per-file-ignores]
"database/matryoshka_db/db_models/*" = ["F821"]
"**/tests/*" = ["S101", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "matryoshka_db", "protos"]
