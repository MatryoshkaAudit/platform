[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["protos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in endpoint definitions
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"database/matryoshka_db/db_models/*" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["app", "matryoshka_db", "protos"]
