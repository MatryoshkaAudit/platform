services:
  postgres:
    image: postgres:16-alpine
    container_name: matryoshka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matryoshka
      POSTGRES_PASSWORD: matryoshka_pass
      POSTGRES_DB: matryoshka_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matryoshka -d matryoshka_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: matryoshka_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  enterprise-service:
    build:
      context: .
      dockerfile: enterprise-service/Dockerfile
    container_name: matryoshka_enterprise_service
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "50051:50051"
    volumes:
      - ./enterprise-service/app:/app/enterprise-service/app
    environment:
      - DB_URL=postgresql+asyncpg://matryoshka:matryoshka_pass@postgres:5432/matryoshka_db
      - DATABASE_URL=postgresql+asyncpg://matryoshka:matryoshka_pass@postgres:5432/matryoshka_db
      - SERVICE_REST_PORT=8001
      - SERVICE_GRPC_PORT=50051
    depends_on:
      postgres:
        condition: service_healthy

  regulator-service:
    build:
      context: .
      dockerfile: regulator-service/Dockerfile
    container_name: matryoshka_regulator_service
    restart: unless-stopped
    ports:
      - "8002:8002"
      - "50052:50052"
    volumes:
      - ./regulator-service/app:/app/regulator-service/app
    environment:
      - DB_URL=postgresql+asyncpg://matryoshka:matryoshka_pass@postgres:5432/matryoshka_db
      - DATABASE_URL=postgresql+asyncpg://matryoshka:matryoshka_pass@postgres:5432/matryoshka_db
      - SERVICE_REST_PORT=8002
      - SERVICE_GRPC_PORT=50052
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - ENTERPRISE_SERVICE_URL=http://enterprise-service:8001
    depends_on:
      postgres:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: matryoshka_clickhouse
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=matryoshka_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_MAX_THREADS=2
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: matryoshka_analytics_service
    restart: unless-stopped
    ports:
      - "8003:8003"
      - "50053:50053"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=matryoshka_analytics
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_REST_PORT=8003
      - SERVICE_GRPC_PORT=50053
    depends_on:
      redis:
        condition: service_started

  enterprise-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matryoshka_enterprise_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - enterprise-service
      - regulator-service
      - analytics-service

  regulator-admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matryoshka_regulator_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - enterprise-service
      - regulator-service
      - analytics-service

volumes:
  postgres_data:
  clickhouse_data:
